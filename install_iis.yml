---
- name: Configure windows iis
  hosts: all
  gather_facts: false

  tasks:

    - name: Install IIS
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_management_tools: true

    - name: Ensure IIS is running
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto
